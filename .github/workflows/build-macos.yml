name: Build TachiKids for macOS
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build app bundle and eye icon
        run: bash ./build-app.sh
      - name: Create ZIP
        run: ditto -c -k --sequesterRsrc --keepParent dist/TachiKids.app TachiKids-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: TachiKids-macOS
          path: TachiKids-macOS.zip
          retention-days: 30
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TachiKids-macOS.zip
